name: CI

# Builds every push and PR on both platforms. The point is to catch a break in
# the packaging path before a tag is pushed, because a Release run that fails
# halfway leaves a tag with no assets attached to it.
#
# CB-367: this used to be one job per rid with every suite as a step, so wall
# time was their sum (~23 min on macOS). It is now parallel jobs per rid plus a
# `build` gate, so wall time is the slowest group plus its own build. Each job
# checks out and builds for itself: Integration's whole step, build included, is
# ~77 s, and sharing bin/obj between runners means `--no-build` against MTP's
# rid-specific output paths, which is more fragile than a minute's build.
#
# CB-375: Windows runs five jobs (checks, unit, ui, screenshots, package), which
# all start at once and finish in ~6 min. macOS runs THREE. GitHub's documented
# concurrency cap for macOS jobs on the Team plan is 5 (from GitHub's docs, not
# measured here), and five macOS jobs per run meant that with several PRs in
# flight every run queued behind the others: run 44248428760's macOS jobs sat
# ~20 min in the queue. One job definition (`suite`) serves both: the matrix
# says which suites an instance runs, and each suite's steps carry
# `if: !cancelled() && matrix.<suite>` so a red suite does not skip the next
# one in the same job. The macOS grouping and why is in the matrix.
#
# What used to be true and no longer is: "a failing test blocks the artifact
# the same way a failed publish does, in the same job". `package` now runs in
# parallel with the suites, so `unsigned-<rid>` uploads even when a suite is
# red. What blocks is the `build` gate below.
#
# The required status checks (ruleset "main and develop: PRs only") are
# `build (macos-latest, osx-arm64)` and `build (windows-latest, win-x64)`.
# `build` keeps exactly those names and means "every job passed". It runs
# `if: always()` and checks each need's result itself, because a job skipped
# on a failed need reports as passing to a required check. It aggregates
# across both rids (`needs.<job>.result` covers the whole matrix), so a
# Windows-only failure turns both checks red; both are required anyway, so
# what blocks a merge is unchanged, and the failing rid is the one whose
# `suite` job is red. The workflow name stays `CI` and `ui-screenshots-<rid>`
# stays the only artifact with that prefix: publish-screenshots.yml listens
# for this workflow by name and downloads by that pattern.
#
# develop is in the push trigger alongside main because that is where feature/
# and bugfix/ branches land first and sit for a while -- untested until a
# release branch cuts, previously.
on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A push to a PR branch supersedes the run before it, which would otherwise sit
# on macOS runners (three jobs per run, see above) while the run that matters
# queues behind it. Only pull_request runs are cancelled: a push to main or
# develop, and workflow_dispatch, group by their own run id and never cancel
# one another.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# CB-466: nothing a workflow launches may count as a real install. The suites
# never reach the ping (see InstallPingSingleSiteTests); this covers any step that
# starts a built app, and marks it ours if it somehow does.
env:
  ORBWEAVER_INSTALL_PING: "0"
  ORBWEAVER_INTERNAL: "1"

jobs:
  # One job definition; which suites each instance runs is in the matrix below.
  suite:
    name: ${{ matrix.name }} (${{ matrix.rid }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS: three jobs per run (CB-375), grouped from run 44248428760's
          # measured macOS times: checks 4:50, unit 5:28, ui 6:06, screenshots
          # 1:51, package 1:46. checks+screenshots 6:41, unit+package 7:14, ui
          # 6:06 -- the lowest longest-job of any three-way grouping (the other
          # candidates: checks+package / unit / ui+screenshots 6:36 / 5:28 /
          # 7:57; checks+package / unit+screenshots / ui 6:36 / 7:19 / 6:06).
          - { os: macos-latest, rid: osx-arm64, name: checks-screenshots, checks: true, screenshots: true }
          - { os: macos-latest, rid: osx-arm64, name: unit-package, unit: true, package: true }
          - { os: macos-latest, rid: osx-arm64, name: ui, ui: true }
          # Windows keeps five: its jobs all start at once and finish in ~6 min.
          - { os: windows-latest, rid: win-x64, name: checks, checks: true }
          - { os: windows-latest, rid: win-x64, name: unit, unit: true }
          - { os: windows-latest, rid: win-x64, name: ui, ui: true }
          - { os: windows-latest, rid: win-x64, name: screenshots, screenshots: true }
          - { os: windows-latest, rid: win-x64, name: package, package: true }
    runs-on: ${{ matrix.os }}
    # CB-269: a backstop above every step's own limit; the step limits below are
    # what normally fire. CB-385: 30, down from 60. A macOS runner occasionally
    # goes silent mid-Integration-step (CB-382) and only this job-level limit
    # ends it, so each occurrence holds a scarce slot for the whole limit.
    # Worst healthy job measured over 25 recent green runs (both rids): osx-arm64
    # 11.7 min (ui, a run where UiTests retried once), win-x64 7.0 min; even
    # three UiTests attempts at ~5.5 min each plus the build is ~19 min, so
    # 30 clears every healthy case with margin. If a healthy job ever
    # approaches it, raise it.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # tools/merge-coverage.py is the only Python in the repository that
      # decides anything, and what it decides is the coverage number every
      # review here is read against. It had no test at all until CB-100, which
      # is how a rule that let one engine invent branch points the other never
      # saw survived long enough to understate every pure-logic file's branch
      # coverage. A wrong merge rule prints a number rather than failing, so it
      # needs a suite for the same reason everything else here does. stdlib
      # unittest, so there is nothing to pip install.
      #
      # setup-python rather than whatever the image happens to ship, because
      # the two legs do not agree on the name: the Windows image puts `python`
      # on PATH and no `python3`, while `python3` is the spelling that works on
      # macOS. setup-python guarantees `python` on both, which is the only
      # reason this step can be one line instead of a matrix branch.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # The three bespoke suites predate xUnit here and keep their own
      # contract: exit non-zero on failure, `dotnet run` rather than
      # `dotnet test`. Platform-neutral, so both legs run all three.
      - name: Unit tests (arrangement, glyph, transcript)
        if: ${{ !cancelled() && matrix.checks }}
        run: |
          dotnet run --project tests/ArrangementTests -c Release
          dotnet run --project tests/GlyphTests -c Release
          dotnet run --project tests/TranscriptTests -c Release


      - name: Unit tests (merge-coverage.py)
        if: ${{ !cancelled() && matrix.checks }}
        run: python tools/test-merge-coverage.py

      # CB-317..320: every workflow declares its token permissions and the job
      # that reads the signing secrets sits behind the `release` environment.
      - name: Unit tests (workflow hardening)
        if: ${{ !cancelled() && matrix.checks }}
        run: python tools/test-workflow-hardening.py

      # CB-455: the bug-fix org's host side (App manifest helper, warden rules,
      # ruleset JSON and apply script, stress-run.py). Fakes only: no GitHub,
      # no Paperclip. The bash-based apply-script cases skip themselves on
      # Windows, where the host that runs them is not.
      - name: Unit tests (bug-fix org host side)
        if: ${{ !cancelled() && matrix.checks }}
        run: python tools/test-bugfix-host.py

      # CB-485: the bug-fix org's medic (host/medic.py): its four checks, every
      # verb and refusal, the lock and the rate limit, with Paperclip, GitHub
      # and the model launcher faked. No model is started. macOS only: the
      # medic runs on the mini alone and its lock is fcntl's, which Windows
      # does not have.
      - name: Unit tests (bug-fix org medic)
        if: ${{ !cancelled() && matrix.checks && runner.os == 'macOS' }}
        run: python tools/test-bugfix-medic.py

      # CB-481: Orbweaver-Mobile's ruleset JSON, the apply script run against
      # it, and the read-back and push-refusal checker. Fakes only.
      - name: Unit tests (bug-fix org mobile rulesets)
        if: ${{ !cancelled() && matrix.checks }}
        run: python tools/test-bugfix-rulesets-mobile.py

      # CB-470: the machine runner (spool rules, hold, cap, restore) and its
      # Windows seam, against fake machines, a fake gh and a fake clock. No
      # ssh and no machine; the run_once file-level cases skip on Windows,
      # where the runner (which lives on the mini) never runs.
      - name: Unit tests (bug-fix org machine runner)
        if: ${{ !cancelled() && matrix.checks }}
        run: python tools/test-bugfix-machines.py

      # CB-470: the Mac half of the machine runner (signed e2e build, install,
      # restore), same fakes-only rule.
      - name: Unit tests (bug-fix org machine runner, Macs)
        if: ${{ !cancelled() && matrix.checks }}
        run: python tools/test-bugfix-machines-mac.py

      # CB-494: the remote test runner (allow-list, pushed-sha gate, queue,
      # unreachable target, cap) against a fake mirror and fake targets. The
      # target's own shell scripts run for real in a scratch HOME on the
      # macOS leg and skip on Windows, where there is no bash-git-perl trio
      # to trust and the runner never runs.
      - name: Unit tests (bug-fix org remote test runner)
        if: ${{ !cancelled() && matrix.checks }}
        run: python tools/test-bugfix-remote.py

      # CB-455: the same host side against loopback stand-ins for Paperclip and the
      # GitHub App API and stub gh/dotnet scripts, every pause trigger beside its
      # control. POSIX only; the cases skip themselves on the Windows leg.
      - name: End-to-end tests (bug-fix org host side)
        if: ${{ !cancelled() && matrix.checks }}
        run: python tools/test-bugfix-host-e2e.py

      # CB-256: no unrecorded "Claude Buddy" may reappear. The tests prove the
      # checker; the second step runs it on this tree against the exact-count
      # allow-list in tools/brand-allowlist.txt.
      - name: Unit tests (check-brand.py)
        if: ${{ !cancelled() && matrix.checks }}
        run: python tools/test-check-brand.py

      - name: Brand check (check-brand.py)
        if: ${{ !cancelled() && matrix.checks }}
        run: python tools/check-brand.py

      # CB-323: the phone and Watch icons make-icons.py writes into docs/brand/mobile/.
      # The unit tests carry the negative controls (the 512 cut must fail the 29-px
      # check, a tinted icon with colour must fail, and so on); the second step runs
      # the checker on the committed files and compares their decoded pixels with a
      # fresh render, so a hand-exported PNG fails here. Pixels, not bytes: zlib's
      # output differs between the two runners and the pixels do not.
      - name: Unit tests (check-brand-icons.py)
        if: ${{ !cancelled() && matrix.checks }}
        run: python tools/test-check-brand-icons.py

      - name: Mobile icon check (check-brand-icons.py)
        if: ${{ !cancelled() && matrix.checks }}
        run: python tools/check-brand-icons.py

      # CB-273: the PreToolUse hook that keeps agent-team members as team
      # processes and PR bodies honest. Skips itself where bash or jq is
      # missing, which is where the hook fails open by design.
      - name: Unit tests (require-team-sdlc.sh)
        if: ${{ !cancelled() && matrix.checks }}
        run: python tools/test-require-team-sdlc.py

      # CB-455: the Paperclip bug-fix org package. Pins its YAML against the
      # three things Paperclip's reader gets wrong, the brakes the plan relies
      # on, the Bug-only and PR-body rules, and the sandbox profile's deny for
      # the install lock, each with a negative control. Pure stdlib, no
      # Paperclip needed.
      - name: Unit tests (paperclip bugfix-org package)
        if: ${{ !cancelled() && matrix.checks }}
        run: python tools/test-paperclip-bugfix-org.py

      # CB-494: the bug-fix org's one-heavy-dotnet-at-a-time stand-in, driven
      # against a fake dotnet (never the SDK). Skips itself where lockf is
      # absent, i.e. on the Windows leg; the shim only runs on the mini.
      - name: Unit tests (bugfix-org dotnet shim)
        if: ${{ !cancelled() && matrix.checks }}
        run: python tools/test-bugfix-dotnet-wrapper.py

      # CB-494: ow-remote, how the bug-fix org's agents ask the remote runner
      # for a build or test. Real git against a local bare origin; the test
      # plays the runner by writing the result folder.
      - name: Unit tests (bugfix-org ow-remote)
        if: ${{ !cancelled() && matrix.checks }}
        run: python tools/test-bugfix-ow-remote.py

      # CB-291: the team resolver the orbweaver-team skill ships. Real script,
      # real files in a scratch pool; on the Windows leg it runs under Git Bash
      # with Windows-style paths, which is what Claude Code uses there and what
      # the script's path conversion has to get right. macOS runs it under
      # bash 3.2, which is why it uses no associative arrays.
      - name: Unit tests (orbweaver-team.sh)
        if: ${{ !cancelled() && matrix.checks }}
        run: python tools/test-orbweaver-team.py

      # CB-291: install-skill.sh, which copies the skill into each Claude Code
      # account. Plain bash, so unlike install-macos-hooks.sh (osascript) it runs
      # on both legs; on Windows it is Git Bash again.
      - name: Unit tests (install-skill.sh)
        if: ${{ !cancelled() && matrix.checks }}
        run: python tools/test-install-skill.py

      # CB-237: runs publish-screenshots.yml's real publish step against a local
      # bare repository. Skips itself on Windows -- that workflow runs on ubuntu.
      - name: Unit tests (publish-screenshots.yml)
        if: ${{ !cancelled() && matrix.checks }}
        run: python tools/test-publish-screenshots.py

      # coverage.sh's log-keeping and failing-name extraction (CB-239), run
      # as the shell that ships. On the Windows leg it uses Git Bash
      # explicitly, which is where the names had gone missing.
      - name: Unit tests (coverage.sh functions)
        if: ${{ !cancelled() && matrix.checks }}
        run: python tools/test-coverage-sh.py

      # build-macos-app.sh's --install tail must report 0/1/many running
      # copies instead of exiting 1 when none is running (CB-245, CB-206).
      # Stubbed pgrep/ps, so it runs on both legs and launches nothing.
      - name: Unit tests (build-macos-app.sh install tail)
        if: ${{ !cancelled() && matrix.checks }}
        run: python tools/test-build-macos-app.py

      # CB-367: the budget checker's own suite -- passing control, over-budget
      # failure, allow-listed pass, and the cases where it must refuse to pass.
      - name: Unit tests (check-test-budget.py)
        if: ${{ !cancelled() && matrix.checks }}
        run: python tools/test-check-test-budget.py

      # CB-375: every suite runs exactly once per rid. A missing matrix key is null,
      # not an error, so a typo would skip a suite and leave everything green.
      - name: Unit tests (ci.yml matrix)
        if: ${{ !cancelled() && matrix.checks }}
        run: python tools/test-ci-matrix.py

      # Everything added after those three is xUnit, in tests/Tests.sln. Run
      # as separate `dotnet test` invocations rather than one pass over the
      # whole solution, so a red run in one attributes to a suite by its own
      # job-log section instead of one merged wall of output — this matters
      # most for the headless UI suite, which is the one most likely to be
      # flaky on a runner with no real display.
      #
      # Hook-script integration tests self-gate by OS: HookScriptShTests
      # needs bash (this leg, on macOS) and HookScriptPs1Tests needs pwsh
      # (the Windows leg) — the other half reports as Skipped rather than
      # silently not existing.
      #
      # CB-269: a silent hang here once printed nothing after "A total of 1 test
      # files matched" for six hours, until GitHub cancelled the job. Two limits
      # now, in order. `--blame-hang-timeout 5m` fires first and kills the test
      # host, printing "The test running when the crash occurred" with the names
      # in flight and leaving a Sequence_*.xml that the upload step below keeps;
      # `--blame-hang-dump-type none` because a dump needs createdump, which is
      # not verified on the macOS arm64 runner. `timeout-minutes` is the backstop
      # for a hang before the first test starts, which blame cannot see.
      - name: Unit tests (xUnit)
        if: ${{ !cancelled() && matrix.unit }}
        timeout-minutes: 15
        run: dotnet test tests/UnitTests -c Release --blame-hang-timeout 5m --blame-hang-dump-type none --logger "trx;LogFileName=unit-tests.trx" --results-directory TestResults

      - name: Integration tests (xUnit)
        if: ${{ !cancelled() && matrix.unit }}
        timeout-minutes: 10
        run: dotnet test tests/IntegrationTests -c Release --blame-hang-timeout 5m --blame-hang-dump-type none --logger "trx;LogFileName=integration-tests.trx" --results-directory TestResults

      # xUnit v3 now (see tests/UiTests/Orbweaver.UiTests.csproj's own
      # comment for why), which drops the old VSTest-hosted `dotnet test`
      # path outright on the .NET 10 SDK — `--logger`/`--results-directory`
      # are silently ignored under Microsoft Testing Platform, so trx
      # generation moves to MTP's own `--report-xunit-trx` flag (passed after
      # `--`, straight to the test host) and lands at the fixed,
      # non-configurable `<project>/bin/<config>/<tfm>/<rid>/TestResults/`
      # rather than wherever `--results-directory` points — hence the copy
      # into the shared TestResults/ folder below, so the existing "Upload
      # test results" step still finds it alongside UnitTests'/
      # IntegrationTests' trx files.
      #
      # Retried, not run once: this suite and tests/UiScreenshots both moved
      # to Avalonia 12.1.1 specifically to reach AvaloniaUI/Avalonia#21269,
      # the upstream fix for the FontManager concurrency race that used to
      # make this step fail roughly 1 run in 6-8 on real Windows hardware
      # even with every mitigation tried at 11.3.x (never closing a headless
      # window, disabling xUnit's cross-collection parallelization, a
      # synchronous FontManager warm-up before any test runs). Confirmed
      # fixed locally on macOS — 5 fresh runs of this suite and 23 of
      # tests/UiScreenshots, 0 failures across all of them — but not yet
      # proven on this runner. The retry loop stays until that's confirmed
      # here too: a genuinely broken test fails identically on every
      # attempt, retried or not, so this can only mask a flake that no
      # longer exists, never a real regression.
      #
      # CB-119: the retry loop above used to trust `dotnet test`'s own exit
      # code, and that is exactly what a short run defeats. An [AvaloniaFact]
      # occasionally throws InvalidOperationException out of the per-test
      # isolation scope around it
      # (Avalonia.Headless.HeadlessUnitTestSession.EnsureIsolatedApplication) —
      # not only in [Collection("Settings")], which this comment used to say,
      # and see CB-84/CB-183 below for which half of the scope it really is;
      # xUnit v3 records that as an assembly ERROR, not a test failure, which
      # REPLACES the test's own result — so the report's `errors` attribute
      # goes to 1, the total test count drops by one, and `dotnet test`
      # still exits 0. Two runs out of 28 instrumented did exactly this,
      # unnoticed, because nothing printed it. tools/check-xunit-report.ps1
      # is the fix: it reads the plain xUnit report (`--report-xunit`, kept
      # alongside the existing `--report-xunit-trx` because the TRX schema
      # has no per-error name to print) and is now the thing this loop's
      # `break` actually depends on — not `dotnet test`'s exit code alone.
      # `--minimum-expected-tests` is a second, independent belt from the
      # test host itself; the floor is set BELOW the real total (1081,
      # measured on CB-134's branch) on purpose, so this doesn't need
      # editing every time the suite grows by a test or two. Bump it only as
      # a deliberate edit when the real total moves meaningfully, never to
      # make a red run pass.
      #
      # CB-84: reproduced the "one test fewer" symptom directly — 6 short
      # runs out of 30 on osx-arm64, `dotnet test` exiting 0 every time. Every
      # one carried the same assembly error, and it is a *different* shape
      # from CB-119's EnsureIsolatedApplication cleanup case above: this one
      # throws during the next test's SETUP, not the previous test's
      # teardown — `Dispatcher.VerifyAccess` throwing "The calling thread
      # cannot access this object because a different thread owns it." out of
      # `Avalonia.Rendering.DefaultRenderLoop.Add`, called while
      # `HeadlessUnitTestSession.EnsureIsolatedApplication()` builds the next
      # isolated test's Compositor. xUnit v3 files it the same way CB-119
      # describes — an assembly error that replaces a test's own result — so
      # this guard already covers it without any change; the point of this
      # paragraph is only to save the next person from re-diagnosing it from
      # scratch. The victim test name is not fixed — it is whichever test
      # happens to be next, a different one on nearly every short run — so
      # a victim's name says nothing about where the defect is and should
      # not be recorded as its location. This is a scheduling race in
      # Avalonia's own per-test isolation, not a defect in any one test.
      # Tried bumping Avalonia/Avalonia.Headless/Avalonia.Headless.XUnit/
      # Avalonia.Themes.Fluent 12.1.1 -> 12.1.2 on the theory that "Core –
      # Fix dispatcher frame capturing wrong dispatcher"
      # (AvaloniaUI/Avalonia#22086) was this bug; it was not — the identical
      # stack trace reproduced on 12.1.2 too, twice in a 12-run batch (runs 5
      # and 7, no improvement over the 12.1.1 rate), so the bump was reverted
      # rather than landed as an unverified fix.
      #
      # CB-183: CB-84's closing claim — that no seam exists and this guard is
      # the only mitigation — was wrong, and so was the render-loop-thread
      # theory behind it. The headless render timer runs on the UI thread.
      # What actually happens, read out of the 12.1.1 assemblies: PerTest
      # isolation (the package default) nulls Dispatcher.s_uiThread around
      # every test, and the next thread to read Dispatcher.UIThread becomes
      # its owner. A pool thread left behind by an earlier test wins that
      # race often enough to make one run in three short. The seam is the
      # assembly's AvaloniaTestIsolation level; tests/UiTests/TestAppBuilder.cs
      # sets PerAssembly and says why. Measured on osx-arm64: 2 of 30 Release
      # runs short before, 0 of 30 after; a scratch thread reading
      # Dispatcher.UIThread in a loop turned ~1350 of 1412 tests into this
      # exact error under PerTest and none under PerAssembly.
      # The guard stays regardless: it is what makes a count-flake of any
      # cause visible, and costs nothing when the count is whole.
      #
      # All filename options use space-separated `--flag value`, not
      # `--flag=value`: the MTP CLI parser mis-consumes arguments when two or
      # more `--report-*-filename=...` options appear together in the `=`
      # form (confirmed locally — each works alone with `=`, combining two
      # does not), so `=` is avoided here entirely rather than relied on for
      # some flags and not others.
      # CB-279: `--hangdump` is this suite's half of CB-269. The VSTest suites
      # above got `--blame-hang-timeout`; Microsoft.Testing.Platform needs its
      # own extension for the same thing, Microsoft.Testing.Extensions.HangDump,
      # pinned in both UI csprojs to 1.9.1 — the exact MTP xunit.v3 3.2.2
      # resolves, so this stays on mtp-v1 (see the csproj comments).
      #
      # The timeout is WALL CLOCK from the test host's start, not inactivity —
      # measured, not read: on osx-arm64 a 60s timeout fired one minute into a
      # healthy UiTests run whose in-flight tests were 0s old, and a 5m one
      # fired five minutes into a healthy UiScreenshots run while no test had
      # been running longer than two (not reproduced on Windows). So it cannot
      # borrow CB-269's 5m: it has to sit above a healthy attempt's whole
      # duration and below this step's timeout-minutes. Per suite, from four
      # green CI runs (2026-11-10, step time including the first attempt's
      # build): UiTests 165-271s → 10m here; UiScreenshots 496-513s → 15m
      # there until CB-334 removed its four 120s waits (measured 50s locally
      # after it; the screenshots job now uses 5m, ~6x that). Each retry attempt is a fresh host, so the clock restarts. If a
      # suite's healthy run time ever approaches its figure, raise it: a dump
      # firing on a healthy run is a false hang report at best, and a dump that
      # succeeds is expected (not yet observed here) to end the host with it.
      #
      # What actually names the hung test is NOT the dump. Before it dumps,
      # MTP writes `<assembly>_<pid>_hang.log` next to the TRX, listing every
      # test in flight with how long it had been running; "Report hang dumps"
      # below prints it into this log and uploads it. That matters on
      # macOS, where no dump has completed yet. On one Mac (Developer Mode
      # off) createdump stalled at the point it asks for the target's task
      # port — under MTP, and run directly — and once MTP's own IPC to the
      # host failed with EndOfStreamException instead. Either way no dump
      # landed and nothing killed the host: a genuine hang then ends only at
      # timeout-minutes, exactly as before this change, with the hang log
      # already on disk. Whether the macos-latest runner can take a dump is
      # unverified; the log does not depend on it. Mini, not the default
      # Full, to keep an uploaded dump small.
      - name: UI tests (xUnit, headless)
        if: ${{ !cancelled() && matrix.ui }}
        timeout-minutes: 20
        shell: pwsh
        run: |
          # Real total measured on CB-134's branch is 1081 — set below
          # that so the suite can grow without touching this file; see the
          # step comment above for what this is a belt against.
          $minimumExpectedTests = 1050
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            dotnet test tests/UiTests -c Release -- --report-xunit --report-xunit-filename ui-tests.xunit.xml --report-xunit-trx --report-xunit-trx-filename ui-tests.trx --minimum-expected-tests $minimumExpectedTests --hangdump --hangdump-timeout 10m --hangdump-type Mini
            $testExitCode = $LASTEXITCODE
            $reportPath = "tests/UiTests/bin/Release/net10.0/${{ matrix.rid }}/TestResults/ui-tests.xunit.xml"
            & ./tools/check-xunit-report.ps1 -ReportPath $reportPath -SuiteName "UiTests" -MinimumExpectedTests $minimumExpectedTests -Attempt $attempt -MaxAttempts 3
            $guardExitCode = $LASTEXITCODE
            if ($testExitCode -eq 0 -and $guardExitCode -eq 0) { break }
            Write-Host "UI tests failed on attempt $attempt of 3"
            if ($attempt -eq 3) {
              # Copy the report BEFORE giving up. It used to be copied only after
              # the loop succeeded, which meant a red run uploaded nothing and the
              # only thing in the log was a count — "Failed: 1, Passed: 596" with
              # no name. Working out which test that was, on a platform you are not
              # on, is not a thing anyone should have to guess at.
              New-Item -ItemType Directory -Force -Path TestResults | Out-Null
              Copy-Item "tests/UiTests/bin/Release/net10.0/${{ matrix.rid }}/TestResults/ui-tests.trx" "TestResults/ui-tests.trx" -ErrorAction SilentlyContinue
              exit 1
            }
          }
          New-Item -ItemType Directory -Force -Path TestResults | Out-Null
          Copy-Item "tests/UiTests/bin/Release/net10.0/${{ matrix.rid }}/TestResults/ui-tests.trx" "TestResults/ui-tests.trx"

      # Gated now, not a proof of concept: this started as a 2-screenshot POC
      # with continue-on-error, scaled up to one capture per tests/UiTests
      # scenario (30 total) once the POC proved out. It turns on real Skia
      # rendering — a heavier, different code path from the null renderer
      # the suite above uses — which is exactly what made it hit the
      # FontManager race far harder than that suite ever did; the Avalonia
      # 12.1.1 bump this project and the app both took (see this project's
      # own csproj comment) was specifically to fix that race, not just
      # paper over it. Same trx/copy dance as UI tests above, same retry
      # loop for the same not-yet-Windows-CI-proven reason.
      #
      # CB-183: this suite stays on Avalonia.Headless's default PerTest
      # isolation ON PURPOSE, unlike tests/UiTests. PerAssembly lets fallback
      # fonts loaded by one test persist into the next, so SemiBold text
      # changed weight with test order (50 of 112 captures, pixel deltas up to
      # 229/255; the same test run alone drew what develop draws). The
      # dispatcher race UiTests' attribute closes is therefore still possible
      # here; the CB-119 guard and the retry below are what catch it. It was
      # never seen short in the 2 runs measured, which is not a rate.
      #
      # CB-119: this step's shape matches "UI tests" above exactly — same
      # 3-attempt retry, same trx-copy-before-giving-up — so it gets the same
      # treatment for the same reason: a test-case-cleanup race here would be
      # just as invisible as it is in that suite. See that step's comment for
      # the full explanation of why `dotnet test`'s own exit code can't be
      # trusted alone and why the filename options are space-separated.
      - name: UI screenshots
        if: ${{ !cancelled() && matrix.screenshots }}
        timeout-minutes: 30
        shell: pwsh
        run: |
          # Real total on CB-134's branch is 111 — set below that so the
          # suite can grow without touching this file; see the "UI tests"
          # step above for what this is a belt against.
          $minimumExpectedTests = 100
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            dotnet test tests/UiScreenshots -c Release -- --report-xunit --report-xunit-filename ui-screenshots.xunit.xml --report-xunit-trx --report-xunit-trx-filename ui-screenshots.trx --minimum-expected-tests $minimumExpectedTests --hangdump --hangdump-timeout 5m --hangdump-type Mini
            $testExitCode = $LASTEXITCODE
            $reportPath = "tests/UiScreenshots/bin/Release/net10.0/${{ matrix.rid }}/TestResults/ui-screenshots.xunit.xml"
            & ./tools/check-xunit-report.ps1 -ReportPath $reportPath -SuiteName "UiScreenshots" -MinimumExpectedTests $minimumExpectedTests -Attempt $attempt -MaxAttempts 3
            $guardExitCode = $LASTEXITCODE
            if ($testExitCode -eq 0 -and $guardExitCode -eq 0) { break }
            Write-Host "UI screenshots failed on attempt $attempt of 3"
            if ($attempt -eq 3) {
              # Copy the report BEFORE giving up. It used to be copied only after
              # the loop succeeded, which meant a red run uploaded nothing and the
              # only thing in the log was a count — "Failed: 1, Passed: 596" with
              # no name. Working out which test that was, on a platform you are not
              # on, is not a thing anyone should have to guess at.
              New-Item -ItemType Directory -Force -Path TestResults | Out-Null
              Copy-Item "tests/UiScreenshots/bin/Release/net10.0/${{ matrix.rid }}/TestResults/ui-screenshots.trx" "TestResults/ui-screenshots.trx" -ErrorAction SilentlyContinue
              exit 1
            }
          }
          New-Item -ItemType Directory -Force -Path TestResults | Out-Null
          Copy-Item "tests/UiScreenshots/bin/Release/net10.0/${{ matrix.rid }}/TestResults/ui-screenshots.trx" "TestResults/ui-screenshots.trx"

      # Uploaded as a plain artifact here, not pushed anywhere — this job's
      # GITHUB_TOKEN is deliberately read-only whenever the run was
      # triggered by a pull_request from a fork (GitHub enforces this on
      # every public repo; no `permissions:` block can override it), and
      # this repo's PRs are exactly that. publish-screenshots.yml is a
      # separate workflow, triggered by workflow_run once this one
      # finishes, specifically because that trigger DOES get a real token
      # even for fork-originated runs — it never checks out or executes
      # anything from the fork itself, only downloads what already got
      # built here. (A workflow_run job listing this same workflow by name
      # cannot live in this file: GitHub rejects a workflow that lists
      # itself as its own workflow_run trigger — "cannot listen to itself"
      # — hence the separate file rather than a second job here.)
      - name: Upload screenshots
        if: ${{ always() && matrix.screenshots }}
        uses: actions/upload-artifact@v7
        with:
          name: ui-screenshots-${{ matrix.rid }}
          # Not just *.png: CB-171's glyph diagnostics write a plain-text
          # report next to the captures, and it is only useful on the rid that
          # produces the defect — which is not a machine anyone here can run.
          # publish-screenshots.yml globs *.png of its own accord, so widening
          # this does not push the text file to the screenshots branch.
          path: TestResults/screenshots/*
          if-no-files-found: warn
          retention-days: 14

      # The probe is what every live OpenClaw check runs through, and its compile
      # list is kept by hand: a dependency added to any file in it breaks this
      # build and nothing else, so the break stayed invisible until somebody
      # next needed the probe (three times so far). Building it here turns that
      # into a red build.
      - name: Build (openclaw-probe)
        if: ${{ !cancelled() && matrix.package }}
        run: dotnet build tools/openclaw-probe -c Release --nologo

      - name: Build
        id: publish
        if: ${{ !cancelled() && matrix.package }}
        run: dotnet publish Orbweaver.csproj -c Release -r ${{ matrix.rid }} -p:DebugType=none --nologo

      # The packaging steps below wait on `publish`'s own outcome: !cancelled()
      # lets them run after an earlier suite failed, but a failed publish must
      # not be followed by a second, misleading packaging error.
      #
      # Packaging is where the fiddly, platform-specific work lives (inside-out
      # codesigning, Inno Setup), so exercise it here rather than discovering a
      # break during a release. Signing and notarization are skipped: no secrets
      # are exposed to pull requests.
      - name: Package (macOS)
        if: ${{ !cancelled() && matrix.package && steps.publish.outcome == 'success' && runner.os == 'macOS' }}
        run: ./tools/build-macos-dmg.sh --rid ${{ matrix.rid }}

      - name: Install Inno Setup
        if: ${{ !cancelled() && matrix.package && steps.publish.outcome == 'success' && runner.os == 'Windows' }}
        run: choco install innosetup --no-progress -y

      - name: Package (Windows)
        if: ${{ !cancelled() && matrix.package && steps.publish.outcome == 'success' && runner.os == 'Windows' }}
        run: .\tools\build-windows-installer.ps1 -SkipPublish
        shell: pwsh

      # Not attached to a release, just kept so a failed build can be inspected
      # and so the installer can be smoke-tested from a PR.
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && matrix.package && steps.publish.outcome == 'success' }}
        with:
          name: unsigned-${{ matrix.rid }}
          path: |
            dist/*.dmg
            dist/*.exe
          if-no-files-found: error
          retention-days: 14

      # CB-367 / CB-375: one budget step, one hang-dump report and one results
      # upload per job, over whichever suites the job ran. If a suite step was
      # red before it copied a trx, the budget step adds "no .trx reports found"
      # (exit 2): a symptom of the red suite, never its cause.
      - name: Test time budget
        if: ${{ !cancelled() && (matrix.unit || matrix.ui || matrix.screenshots) }}
        run: python tools/check-test-budget.py --allowlist tools/test-budget-allowlist.txt TestResults

      # CB-279: surfaces what `--hangdump` left behind in either UI suite.
      # always(), because the case this exists for is a suite step killed by
      # timeout-minutes. A hang log on a green run is still reported, as a
      # warning: an attempt ran past its hangdump timeout.
      - name: Report hang dumps
        if: ${{ always() && (matrix.ui || matrix.screenshots) }}
        shell: pwsh
        run: |
          $dest = "TestResults/hangdumps"
          $found = @()
          foreach ($suite in "UiTests", "UiScreenshots") {
            $dir = "tests/$suite/bin/Release/net10.0/${{ matrix.rid }}/TestResults"
            if (Test-Path $dir) { $found += Get-ChildItem -Path $dir -Filter "*_hang.*" -File }
          }
          if ($found.Count -eq 0) { Write-Host "No hang dumps."; exit 0 }
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          foreach ($f in $found) {
            Copy-Item $f.FullName (Join-Path $dest $f.Name)
            if ($f.Extension -eq ".log") {
              $inFlight = (Get-Content $f.FullName) -join "; "
              Write-Host "::warning title=Test host hang ($($f.Name))::In flight when the hang dump fired: $inFlight"
            } else {
              Write-Host "Dump written: $($f.Name) ($([math]::Round($f.Length / 1MB, 1)) MB)"
            }
          }

      - name: Upload hang dumps
        if: ${{ always() && (matrix.ui || matrix.screenshots) }}
        uses: actions/upload-artifact@v7
        with:
          name: hang-dumps-${{ matrix.name }}-${{ matrix.rid }}
          path: TestResults/hangdumps/*
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload test results
        if: ${{ always() && (matrix.unit || matrix.ui || matrix.screenshots) }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.name }}-${{ matrix.rid }}
          path: |
            TestResults/*.trx
            TestResults/**/Sequence_*.xml
          if-no-files-found: error
          retention-days: 14


  # The gate. Name and matrix reproduce the required status checks exactly.
  build:
    name: build (${{ matrix.os }}, ${{ matrix.rid }})
    if: always()
    needs: [suite]
    strategy:
      matrix:
        include:
          - os: macos-latest
            rid: osx-arm64
          - os: windows-latest
            rid: win-x64
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job must have succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success")' > /dev/null \
            || { echo "::error::a CI job was not green (failure, cancelled and skipped all count as red)"; exit 1; }
