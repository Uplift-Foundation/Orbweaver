projects:
  # No executionWorkspacePolicy here on purpose: the CLI sends every
  # existing-company import through Paperclip's agent-safe route, which refuses
  # one ("Safe import does not allow project ... executionWorkspacePolicy",
  # measured 2026-11-24). The git_worktree policy is host/project-workspace-policy.json,
  # applied after import with `paperclipai project update` (see the README).
  orbweaver-develop:
    leadAgentSlug: marisol-vandenberg
    workspaces:
      orbweaver:
        name: Orbweaver
        sourceType: git_repo
        repoUrl: "https://github.com/Uplift-Foundation/Orbweaver.git"
        repoRef: develop
        defaultRef: develop
        isPrimary: true

routines:
  fix-cb-bugs:
    concurrencyPolicy: coalesce_if_active
    catchUpPolicy: skip_missed
    triggers:
      - kind: schedule
        # An hour after the triage org's 09:00 run, weekdays only.
        cronExpression: "0 10 * * 1-5"
        timezone: America/Los_Angeles
