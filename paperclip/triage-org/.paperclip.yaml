# Paperclip-specific settings for the package beside this file.
# Paperclip reads this with its own small YAML reader, and three things it
# got wrong on `company import --dry-run` (2026.1117.0) shape this file:
#   - a first draft using a YAML anchor and no schemaVersion lost every
#     adapter block (which of the two did it was not separated);
#   - a comment after a value became part of the value ("false  # ...");
#   - an unquoted string containing a colon was split into a key and a value.
# So: no anchors, comments on their own line, colon-bearing strings quoted.
schema: paperclip/v1
schemaVersion: 7

agents:
  jennifer-voss:
    role: cto
    adapter:
      type: paperclip_runner
      config:
        model: claude-sonnet-5-5
        # Paperclip's own runner, in its default isolated mode: the agent
        # gets a private home, no login or MCP server from the host, and
        # only the tools the company's connectors grant it. approve-paperclip
        # lets an agent use Paperclip's own task tools (create_task,
        # report_progress, finish_task) without a human and nothing else;
        # approve-reads made every report wait for an approval (measured),
        # and approve-all would approve every tool. What an agent may write
        # outside Paperclip is set per action on the connector.
        acpxPermissionMode: approve-paperclip
        timeoutSec: 1800
    runtime:
      heartbeat:
        # Woken by the routine and by assignment, never by a timer.
        enabled: false
        wakeOnAssignment: true
        wakeOnDemand: true
    budgetMonthlyCents: 5000
